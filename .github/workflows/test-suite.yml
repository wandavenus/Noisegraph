name: Test Noisegraph

on:
  repository_dispatch:
    types:
      - test-suite

permissions:
  contents: read

concurrency:
  group: noisegraph-tests-${{ github.event.client_payload.sha }}-${{ github.event.client_payload.suite }}
  cancel-in-progress: false

jobs:
  flutter:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'flutter' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout workflow repo (local composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Dump source
        id: source
        uses: ./.github/actions/checkout-dump-source
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        working-directory: source
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: source
        run: flutter test --no-pub

  automix-dart:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'automix-dart' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout workflow repo (local composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Dump source
        id: source
        uses: ./.github/actions/checkout-dump-source
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run AutoMix tests
        working-directory: source
        run: |
          flutter test --no-pub \
            test/services/automix_service/automix_engine_test.dart \
            test/services/automix_service/automix_cache_test.dart \
            test/services/automix_service/automix_plan_signature_test.dart

  native-c:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'native-c' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout workflow repo (local composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Dump source
        id: source
        uses: ./.github/actions/checkout-dump-source
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Native Toolchain and ARM64 Emulation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build ccache libclang-dev
          command -v ccache
      - name: Cache native C compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang-x86_64-v1-${{ hashFiles('source/native_audio_runtime/src/**/*.c', 'source/native_audio_runtime/src/**/*.h', 'source/native_audio_runtime/src/**/*.S', 'source/native_audio_runtime/test/automix_native_c_test.c') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang-x86_64-v1-
      - name: Configure native compiler cache
        run: ccache --max-size=1G

      - name: Cache native_audio_runtime Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: native-pub-${{ runner.os }}-${{ hashFiles('source/native_audio_runtime/pubspec.yaml') }}
          restore-keys: |
            native-pub-${{ runner.os }}-
      - name: Get Native Runtime Dependencies
        working-directory: source/native_audio_runtime
        run: flutter pub get

      - name: Verify generated FFI binding is up to date
        working-directory: source/native_audio_runtime
        run: |
          set -euo pipefail
          dart run tool/ffigen.dart
          git -C "$GITHUB_WORKSPACE/source" diff --exit-code -- native_audio_runtime/lib/native_audio_runtime_bindings_generated.dart

      - name: Analyze Native Runtime
        working-directory: source/native_audio_runtime
        run: flutter analyze --no-pub

      - name: Run Native Runtime Tests
        working-directory: source/native_audio_runtime
        run: flutter test --no-pub

      - name: Install Native Runtime Example Dependencies
        working-directory: source/native_audio_runtime/example
        run: flutter pub get

      - name: Analyze Native Runtime Example
        working-directory: source/native_audio_runtime/example
        run: flutter analyze --no-pub

      - name: Test Native Runtime Example
        working-directory: source/native_audio_runtime/example
        run: flutter test --no-pub

      - name: Run native runtime lifecycle and crossfeed C tests
        working-directory: source/native_audio_runtime
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/compile-lifecycle-c-test.sh" gcc /tmp/native_runtime_lifecycle_c_test
          /tmp/native_runtime_lifecycle_c_test

      - name: Build AutoMix C Suite (x86_64, ASan+UBSan)
        working-directory: source/native_audio_runtime
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/compile-automix-c-test.sh" "ccache clang" /tmp/automix_native_c_test

      - name: Run AutoMix C Suite (x86_64)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/automix_native_c_test

      - name: Report native compiler cache
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          else
            echo "ccache was not installed; compiler-cache statistics are unavailable."
          fi

  native-arm64:
    name: Native ARM64 C and NEON
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'native-c' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout workflow repo (local composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Dump source
        id: source
        uses: ./.github/actions/checkout-dump-source
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Install native ARM64 C toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache
          command -v gcc
          command -v ccache

      - name: Cache native ARM64 compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-gcc-arm64-v1-${{ hashFiles('source/native_audio_runtime/src/**/*.c', 'source/native_audio_runtime/src/**/*.h', 'source/native_audio_runtime/src/**/*.S', 'source/native_audio_runtime/test/automix_native_c_test.c') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-gcc-arm64-v1-

      - name: Configure native ARM64 compiler cache
        run: ccache --max-size=1G

      - name: Run native runtime lifecycle and crossfeed C tests
        working-directory: source/native_audio_runtime
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/compile-lifecycle-c-test.sh" gcc /tmp/native_runtime_lifecycle_c_test
          /tmp/native_runtime_lifecycle_c_test

      - name: Build AutoMix C Suite with native ARM64 NEON
        working-directory: source/native_audio_runtime
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/compile-automix-c-test.sh" "ccache gcc" /tmp/automix_native_c_test_arm64 src/automix_neon.S src/automix_tone_neon.S

      - name: Run AutoMix C Suite on native ARM64
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/automix_native_c_test_arm64

      - name: Run NEON differential regression natively
        working-directory: source
        run: bash tools/neon_diff_regression.sh

      - name: Report native ARM64 compiler cache
        if: always()
        run: ccache --show-stats

  kotlin:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'kotlin' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout workflow repo (local composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Dump source
        id: source
        uses: ./.github/actions/checkout-dump-source
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          add-job-summary: never
          cache-provider: enhanced

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x source/android/gradlew

      - name: Run Android unit tests, host tests, and lint
        working-directory: source/android
        run: ./gradlew :app:testDebugUnitTest :app:testReplayGainAnalyzerRegistryHost :app:lintDebug :decoder-ffmpeg:testExtradataPadding --no-daemon --warning-mode=all

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification-reports
          path: |
            source/build/app/reports/lint-results-debug.html
            source/build/app/reports/lint-results-debug.xml
            source/build/app/reports/lint-results-debug.sarif
            source/build/reports/problems/problems-report.html
          if-no-files-found: warn
          retention-days: 14

  android-arm64:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'android-arm64' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout workflow repo (local composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Dump source
        id: source
        uses: ./.github/actions/checkout-dump-source
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          add-job-summary: never
          cache-provider: enhanced

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Compile debug APK for ARM64
        working-directory: source
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Verify FFmpeg JNI and license notices are packaged
        working-directory: source
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/libffmpegJNI.so"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/COPYING.LGPLv2.1"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/LICENSE-2.0.txt"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/THIRD_PARTY_NOTICES.txt"
