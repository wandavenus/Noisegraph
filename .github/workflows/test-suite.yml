name: Test Noisegraph

on:
  repository_dispatch:
    types:
      - test-suite

permissions:
  contents: read

concurrency:
  group: noisegraph-tests-${{ github.event.client_payload.sha }}-${{ github.event.client_payload.suite }}
  cancel-in-progress: false

jobs:
  flutter:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'flutter' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        working-directory: source
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        working-directory: source
        run: flutter test --no-pub

  automix-dart:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'automix-dart' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing AutoMix on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run AutoMix engine tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_engine_test.dart

      - name: Run AutoMix cache tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_cache_test.dart

      - name: Run AutoMix plan signature tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_plan_signature_test.dart

  native-c:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'native-c' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing native DSP on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Compile native AutoMix tests with sanitizers
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p build/native-tests
          cc \
            -std=c11 -O1 -g -Wall -Wextra \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Inative_audio_runtime/src \
            native_audio_runtime/test/automix_native_c_test.c \
            native_audio_runtime/src/automix_analyzer.c \
            native_audio_runtime/src/automix_planner.c \
            native_audio_runtime/src/automix_phase_lock.c \
            native_audio_runtime/src/automix_live_tracker.c \
            native_audio_runtime/src/automix_tone_processor.c \
            -lm -o build/native-tests/automix_native_c_test

      - name: Run native AutoMix tests
        working-directory: source
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: build/native-tests/automix_native_c_test

  kotlin:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'kotlin' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing Kotlin on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Run Kotlin unit tests
        working-directory: source/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-arm64:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'android-arm64' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Building ARM64 from Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Compile debug APK for ARM64
        working-directory: source
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
