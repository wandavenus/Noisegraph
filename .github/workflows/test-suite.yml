name: Test Noisegraph

on:
  repository_dispatch:
    types:
      - test-suite

permissions:
  contents: read

concurrency:
  group: noisegraph-tests-${{ github.event.client_payload.sha }}-${{ github.event.client_payload.suite }}
  cancel-in-progress: false

jobs:
  flutter:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'flutter' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('source/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-
      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        working-directory: source
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        working-directory: source
        run: flutter test --no-pub

  automix-dart:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'automix-dart' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing AutoMix on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('source/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-
      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run AutoMix engine tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_engine_test.dart

      - name: Run AutoMix cache tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_cache_test.dart

      - name: Run AutoMix plan signature tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_plan_signature_test.dart

  native-c:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'native-c' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing native DSP + AutoMix C/NEON on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Native Toolchain and ARM64 Emulation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build gcc-aarch64-linux-gnu qemu-user-static ccache
      - name: Cache native C compiler objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang-aarch64-v1-${{ hashFiles('source/native_audio_runtime/src/**/*.c', 'source/native_audio_runtime/src/**/*.h', 'source/native_audio_runtime/src/**/*.S', 'source/native_audio_runtime/test/automix_native_c_test.c') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang-aarch64-v1-
      - name: Configure native compiler cache
        run: ccache --max-size=1G

      - name: Cache native_audio_runtime Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: native-pub-${{ runner.os }}-${{ hashFiles('source/native_audio_runtime/pubspec.yaml') }}
          restore-keys: |
            native-pub-${{ runner.os }}-
      - name: Get Native Runtime Dependencies
        working-directory: source/native_audio_runtime
        run: flutter pub get

      - name: Run Native Unit Tests
        working-directory: source/native_audio_runtime
        run: flutter test test/native_audio_runtime_test.dart

      - name: Run Performance Benchmarks
        working-directory: source/native_audio_runtime
        run: flutter test test/native_benchmark.dart

      - name: Build AutoMix C Suite (x86_64, ASan+UBSan)
        working-directory: source/native_audio_runtime
        run: |
          set -euo pipefail
          C_FLAGS=(
            -std=c11 -O1 -g -fno-omit-frame-pointer
            -fsanitize=address,undefined -Wall -Wextra -pthread
            -I src
          )
          C_SOURCES=(
            test/automix_native_c_test.c
            src/automix_analyzer.c src/automix_planner.c
            src/automix_phase_lock.c src/automix_tone_processor.c
            src/automix_live_tracker.c
          )
          OBJECTS=()
          for source_file in "${C_SOURCES[@]}"; do
            object_file="/tmp/native-x86-$(basename "${source_file%.c}").o"
            ccache clang "${C_FLAGS[@]}" -c "$source_file" -o "$object_file"
            OBJECTS+=("$object_file")
          done
          clang "${C_FLAGS[@]}" "${OBJECTS[@]}" -lm -o /tmp/automix_native_c_test

      - name: Run AutoMix C Suite (x86_64)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/automix_native_c_test

      - name: Build AutoMix C Suite (arm64 + NEON)
        working-directory: source/native_audio_runtime
        run: |
          set -euo pipefail
          C_FLAGS=(
            -O2 -g -Wall -Wextra -pthread
            -I src
          )
          C_SOURCES=(
            test/automix_native_c_test.c
            src/automix_analyzer.c src/automix_planner.c
            src/automix_phase_lock.c src/automix_tone_processor.c
            src/automix_live_tracker.c
            src/automix_neon.S src/automix_tone_neon.S
          )
          OBJECTS=()
          for source_file in "${C_SOURCES[@]}"; do
            object_file="/tmp/native-arm64-$(basename "${source_file%.*}").o"
            ccache aarch64-linux-gnu-gcc "${C_FLAGS[@]}" -c "$source_file" -o "$object_file"
            OBJECTS+=("$object_file")
          done
          aarch64-linux-gnu-gcc "${C_FLAGS[@]}" "${OBJECTS[@]}" -lm -o /tmp/automix_native_c_test_arm64

      - name: Run AutoMix C Suite (arm64 under qemu)
        run: qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/automix_native_c_test_arm64
      - name: Report native compiler cache
        if: always()
        run: ccache --show-stats

  kotlin:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'kotlin' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing Kotlin on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Resolve Android SDK root
        id: android-sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
      - name: Cache Android SDK, NDK, and CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/platforms/android-36
            ${{ steps.android-sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.android-sdk.outputs.root }}/cmake/3.22.1
            ${{ steps.android-sdk.outputs.root }}/ndk/28.2.13676358
          key: android-toolchain-${{ runner.os }}-${{ runner.arch }}-api36-bt36-cmake3.22.1-ndk28.2.13676358
          restore-keys: |
            android-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('source/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-
      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Run Kotlin unit tests
        working-directory: source/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-arm64:
    if: ${{ github.event.client_payload.suite == 'all' || github.event.client_payload.suite == 'android-arm64' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Building ARM64 from Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Resolve Android SDK root
        id: android-sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
      - name: Cache Android SDK, NDK, and CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/platforms/android-36
            ${{ steps.android-sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.android-sdk.outputs.root }}/cmake/3.22.1
            ${{ steps.android-sdk.outputs.root }}/ndk/28.2.13676358
          key: android-toolchain-${{ runner.os }}-${{ runner.arch }}-api36-bt36-cmake3.22.1-ndk28.2.13676358
          restore-keys: |
            android-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('source/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-
      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Compile debug APK for ARM64
        working-directory: source
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
