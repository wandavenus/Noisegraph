name: Test Android Kotlin

on:
  repository_dispatch:
    types:
      - test-kotlin

permissions:
  contents: read

concurrency:
  group: noisegraph-test-kotlin-${{ github.event.client_payload.sha }}
  cancel-in-progress: false

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing Kotlin on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Run Kotlin unit tests
        working-directory: source/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
