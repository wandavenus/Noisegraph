name: Build Android APK

on:
  repository_dispatch:
    types:
      - build-private-source
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Source commit SHA to build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source commit
        id: source
        env:
          EVENT_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SHA="${EVENT_SHA:-$MANUAL_SHA}"
          if [ -z "$SHA" ]; then
            echo "::error::Source commit SHA is missing."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          # The build targets an explicit commit SHA and does not use source history.
          fetch-depth: 1

      # Reuse CMake/Ninja build trees and FetchContent sources for libebur128,
      # TagLib, and Signalsmith. On source/config changes, restore the last
      # compatible tree so CMake/Ninja can regenerate and rebuild changed inputs.
      - name: Cache native CMake and Ninja build
        id: native-cmake-cache
        uses: actions/cache@v6
        with:
          path: source/android/app/.cxx
          key: native-cmake-${{ runner.os }}-${{ runner.arch }}-ndk-28.2.13676358-cmake-3.22.1-arm64-v8a-${{ hashFiles('source/android/app/build.gradle', 'source/android/build.gradle', 'source/android/settings.gradle', 'source/android/gradle.properties', 'source/android/app/src/main/cpp/**/*', 'source/native_audio_runtime/src/**/*') }}
          restore-keys: |
            native-cmake-${{ runner.os }}-${{ runner.arch }}-ndk-28.2.13676358-cmake-3.22.1-arm64-v8a-

      - name: Cache FFmpeg build outputs
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: source/android/decoder-ffmpeg/.ffmpeg-build
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-ndk-28.2.13676358-api-27-n8.1.3-${{ hashFiles('source/android/build-ffmpeg-jni.sh', 'source/android/decoder-ffmpeg/src/main/jni/ffmpeg_jni.cc') }}
          restore-keys: |
            ffmpeg-${{ runner.os }}-${{ runner.arch }}-ndk-28.2.13676358-api-27-n8.1.3-

      - name: Resolve Android SDK cache path
        id: android-sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ndk_path=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_OUTPUT"

      - name: Cache pinned Android NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.android-sdk.outputs.ndk_path }}
          key: android-ndk-${{ runner.os }}-${{ runner.arch }}-28.2.13676358

      - name: Generate changelog from source commit in Dump
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          # Use the subject of the exact Dump commit being built.
          commit_title="$(gh api "repos/wandavenus/Dump/commits/$SOURCE_SHA" --jq '.commit.message | split("\n")[0]')"

          if [ -z "$commit_title" ]; then
            echo "::error::Unable to resolve the source commit title from wandavenus/Dump."
            exit 1
          fi

          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "- $commit_title"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned Android NDK
        working-directory: source
        run: |
          set -euo pipefail
          EXPECTED_NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found; Android SDK root was '$SDK_ROOT'."
            exit 1
          fi
          NDK_DIR="$SDK_ROOT/ndk/$EXPECTED_NDK_VERSION"
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;$EXPECTED_NDK_VERSION"
          else
            echo "Using cached or preinstalled Android NDK at $NDK_DIR."
          fi
          test -f "$NDK_DIR/source.properties"
          ACTUAL_NDK_VERSION="$(sed -n 's/^Pkg.Revision *= *//p' "$NDK_DIR/source.properties" | head -n 1)"
          if [ "$ACTUAL_NDK_VERSION" != "$EXPECTED_NDK_VERSION" ]; then
            echo "::error::Expected NDK $EXPECTED_NDK_VERSION, found '${ACTUAL_NDK_VERSION:-unknown}'."
            exit 1
          fi
          echo "ndk.dir=$NDK_DIR" >> "$GITHUB_WORKSPACE/source/android/local.properties"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Android NDK $ACTUAL_NDK_VERSION ready at $NDK_DIR."

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('source/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Set Android version
        working-directory: source
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d '\r')
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Unable to read app version from pubspec.yaml"
            exit 1
          fi
          sed -i "s/^version: .*/version: $VERSION_NAME/" pubspec.yaml
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties

      - name: Configure release signing
        working-directory: source
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured in Noisegraph."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          keytool -list -keystore android/app/release-keystore.jks -storetype PKCS12 -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          keytool -importkeystore \
            -srckeystore android/app/release-keystore.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_STORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore /tmp/release-key-validation.jks \
            -deststoretype PKCS12 \
            -deststorepass "ci-validation-only" \
            -destkeypass "ci-validation-only" \
            -noprompt >/dev/null 2>&1
          rm -f /tmp/release-key-validation.jks

      - name: Build release APK
        working-directory: source
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/source/android/app/release-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --no-pub
          --obfuscate
          --split-debug-info=build/debug-info

      - name: Verify FFmpeg JNI and license notices are packaged
        working-directory: source
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/libffmpegJNI.so"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/COPYING.LGPLv2.1"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/LICENSE-2.0.txt"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/THIRD_PARTY_NOTICES.txt"

      - name: Prepare APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p release
          cp "source/build/app/outputs/flutter-apk/app-release.apk" "release/Noisegraph-$RUN_NUMBER-arm64-v8a.apk"

      - name: Upload APK to Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_id }}
          name: "Android Build #${{ github.run_number }}"
          draft: true
          body: |
            Automated release build for Noisegraph.

            Changelog:
            ${{ steps.changelog.outputs.body }}

            Source revision: `${{ steps.source.outputs.sha }}`

          files: release/Noisegraph-${{ github.run_number }}-arm64-v8a.apk
