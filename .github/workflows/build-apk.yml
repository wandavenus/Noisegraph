name: Build Android APK

on:
  repository_dispatch:
    types:
      - build-private-source
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Source commit SHA to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve source commit
        id: source
        env:
          EVENT_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SHA="${EVENT_SHA:-${MANUAL_SHA}}"
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Source commit SHA is missing or invalid."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building Dump commit: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout workflow repo (local composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout private source
        uses: ./.github/actions/checkout-dump-source
        with:
          sha: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - name: Validate build scripts
        working-directory: source
        run: |
          set -euo pipefail
          bash -n android/build-ffmpeg-jni.sh
          bash -n scripts/ci/install-android-ndk.sh

      - name: Resolve Android SDK root
        id: android-sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

      - name: Set up Android SDK licenses
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 14742923
          packages: ''

      - name: Install Android CLI
        uses: ./.github/actions/install-android-cli


      # NOTE: the pinned NDK is intentionally NOT cached. The runner image
      # already ships ndk/30.0.16248370 under the SDK root, owned by root;
      # caching that tree makes actions/cache restore fail on every run
      # (tar cannot utime/chmod the pre-existing root-owned directories).
      # The install step below verifies the preinstalled NDK in seconds
      # and downloads it only if a future image drops it.

      - name: Cache native CMake and Ninja build
        id: native-cmake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/android/app/.cxx
          key: native-cmake-${{ runner.os }}-${{ runner.arch }}-ndk-30.0.16248370-cmake-4.1.2-arm64-v8a-${{ hashFiles('source/android/app/build.gradle', 'source/android/build.gradle', 'source/android/settings.gradle', 'source/android/gradle.properties', 'source/android/app/src/main/cpp/**/*', 'source/native_audio_runtime/src/**/*') }}
          restore-keys: |
            native-cmake-${{ runner.os }}-${{ runner.arch }}-ndk-30.0.16248370-cmake-4.1.2-arm64-v8a-

      - name: Cache FFmpeg build outputs
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/android/decoder-ffmpeg/.ffmpeg-build
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-ndk-30.0.16248370-api-27-n8.1.3-${{ hashFiles('source/android/build-ffmpeg-jni.sh', 'source/android/decoder-ffmpeg/src/main/jni/ffmpeg_jni.cc') }}
          restore-keys: |
            ffmpeg-${{ runner.os }}-${{ runner.arch }}-ndk-30.0.16248370-api-27-n8.1.3-

      - name: Install pinned Android NDK
        working-directory: source
        run: |
          set -euo pipefail
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE/source" bash scripts/ci/install-android-ndk.sh

      - name: Install Dump Android SDK build targets
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # platform-tools stays on the stable channel: the newest dev/canary
          # archive (platform-tools_r37.0.2-linux.zip) is advertised in the
          # repository manifest but returns HTTP 404 from dl.google.com,
          # which killed this step before any compilation happened.
          "$ANDROID_CLI" --sdk="$SDK_ROOT" sdk install \
            platform-tools
          "$ANDROID_CLI" --sdk="$SDK_ROOT" sdk install --canary \
            platforms/android-37.0 build-tools/37.0.0 cmake/4.1.2

          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$SDK_ROOT/build-tools/37.0.0/aapt2"
          test -x "$SDK_ROOT/cmake/4.1.2/bin/cmake"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          add-job-summary: never
          cache-provider: enhanced

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Set Android version
        working-directory: source
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d '\r')
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Unable to read app version from pubspec.yaml"
            exit 1
          fi
          sed -i "s/^version: .*/version: $VERSION_NAME/" pubspec.yaml
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties

      - name: Configure release signing
        working-directory: source
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured in Noisegraph."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          keytool -list -keystore android/app/release-keystore.jks -storetype PKCS12 -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          keytool -importkeystore \
            -srckeystore android/app/release-keystore.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_STORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore /tmp/release-key-validation.jks \
            -deststoretype PKCS12 \
            -deststorepass "ci-validation-only" \
            -destkeypass "ci-validation-only" \
            -noprompt >/dev/null 2>&1
          rm -f /tmp/release-key-validation.jks

      - name: Build release APK
        working-directory: source
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/source/android/app/release-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --no-pub \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--strip

      - name: Upload deobfuscation symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-info-${{ github.run_number }}
          path: source/build/debug-info
          if-no-files-found: warn
          retention-days: 90

      - name: Verify FFmpeg JNI and license notices are packaged
        working-directory: source
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/libffmpegJNI.so"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/COPYING.LGPLv2.1"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/LICENSE-2.0.txt"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/THIRD_PARTY_NOTICES.txt"

      - name: Prepare APK for draft release
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp "source/build/app/outputs/flutter-apk/app-release.apk" "release/Noisegraph-$RUN_NUMBER-arm64-v8a.apk"

      - name: Upload APK to Draft Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: build-${{ github.run_id }}
          name: "Android Build #${{ github.run_number }}"
          draft: true
          body: |
            Automated release build for Noisegraph.

            Source revision: ${{ steps.source.outputs.sha }}

          files: release/Noisegraph-${{ github.run_number }}-arm64-v8a.apk
