name: Test AutoMix Dart

on:
  repository_dispatch:
    types:
      - test-automix-dart

permissions:
  contents: read

concurrency:
  group: noisegraph-test-automix-dart-${{ github.event.client_payload.sha }}
  cancel-in-progress: false

jobs:
  automix-dart:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid Dump commit SHA in repository_dispatch payload."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing AutoMix on Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private Dump source
        uses: actions/checkout@v7
        with:
          repository: wandavenus/Dump
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run AutoMix engine tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_engine_test.dart

      - name: Run AutoMix cache tests
        working-directory: source
        run: flutter test --no-pub test/services/automix_service/automix_cache_test.dart
