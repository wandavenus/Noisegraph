name: Set up Android toolchain
description: >-
  Configure a writable Android SDK root and install the pinned platform,
  build-tools, CMake and NDK used by the Android test jobs.

runs:
  using: composite
  steps:
    - name: Configure writable Android SDK root
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="$HOME/.android/sdk"
        mkdir -p "$SDK_ROOT"
        {
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
        } >> "$GITHUB_ENV"

    - name: Set up Android SDK licenses
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        cmdline-tools-version: 14742923
        packages: ''

    - name: Resolve Android SDK root
      id: android-sdk
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
        echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"

    - name: Cache Android SDK, NDK, and CMake
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.android-sdk.outputs.root }}/platforms/android-37.0
          ${{ steps.android-sdk.outputs.root }}/build-tools/37.0.0
          ${{ steps.android-sdk.outputs.root }}/cmake/4.1.2
          ${{ steps.android-sdk.outputs.root }}/ndk/30.0.16248370
        key: android-toolchain-home-${{ runner.os }}-${{ runner.arch }}-api37.0-bt37.0.0-cmake4.1.2-ndk30.0.16248370-v3
        restore-keys: |
          android-toolchain-home-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Android CLI
      uses: ./.github/actions/install-android-cli

    - name: Install SDK packages
      shell: bash
      run: |
        set -euo pipefail
        "$ANDROID_CLI" --sdk="$ANDROID_SDK_ROOT" sdk install --canary \
          platforms/android-37.0 build-tools/37.0.0 cmake/4.1.2 \
          ndk/30.0.16248370

        NDK_DIR="$ANDROID_SDK_ROOT/ndk/30.0.16248370"
        test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
        test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
        test -x "$ANDROID_SDK_ROOT/cmake/4.1.2/bin/cmake"
        test -f "$NDK_DIR/source.properties"
        {
          echo "ANDROID_NDK_HOME=$NDK_DIR"
          echo "ANDROID_NDK=$NDK_DIR"
        } >> "$GITHUB_ENV"
