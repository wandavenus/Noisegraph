name: Checkout Dump source
description: Validate a Dump commit SHA and check out wandavenus/Dump into source/.

inputs:
  sha:
    description: "Full 40-character Dump commit SHA"
    required: true
  token:
    description: "Token with read access to wandavenus/Dump"
    required: true

outputs:
  sha:
    description: "The validated commit SHA"
    value: ${{ steps.validate.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Validate source commit
      id: validate
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::Missing or invalid Dump commit SHA."
          exit 1
        fi
        echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
        echo "Dump commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

    - name: Checkout private Dump source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: wandavenus/Dump
        ref: ${{ inputs.sha }}
        token: ${{ inputs.token }}
        path: source
        persist-credentials: false
        fetch-depth: 1
